name: Feature request
description: Suggest something Ronne should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Planned work is in the features index (docs/features/README.md): check whether it's there first. If you'd like to build it yourself, say so below, and read CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from the point of view of the person using it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: checkboxes
    id: contribute
    attributes:
      label: Building it
      options:
        - label: I'd like to build this myself
