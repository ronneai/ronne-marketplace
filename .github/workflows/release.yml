name: Release

# Publishes a release when a tag vX.Y.Z matching the shared version is pushed:
#
# 1. `release` (features 034, 082): @ronneai/core, @ronneai/rmk, @ronneai/mcp and
#    @ronneai/marketplace (the server, rmk-server) to npm. npm's trusted
#    publishing: GitHub's OIDC token proves the package comes from this workflow, so there's no npm
#    token to store, and every version gets provenance. Each package must be linked to this
#    repository, this workflow and the "npm" environment once on npmjs.com, and the "npm"
#    environment needs the owner as its required reviewer: nothing runs without that click.
# 2. `image` and `manifest` (feature 035): the web app's Docker image, docker.io/ronneai/marketplace,
#    for linux/amd64 and linux/arm64. Each architecture is built natively, run and scanned with the
#    same composite action as every pull request (.github/actions/build-image), then pushed by
#    digest with OCI labels, and BuildKit provenance and SBOM attestations. The manifest job tags the
#    multi-architecture list X.Y.Z, X.Y, X (not for major 0) and latest (not for a pre-release), and
#    refuses to move a version that already points at other images. Docker Hub's credentials live in
#    the "dockerhub" environment (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN); it needs no reviewer of its
#    own, since its jobs only run after the npm job the owner approved.
# 3. `bundles` (feature 084, bundles.yml): rmk-server with Node.js inside, one archive per system
#    and processor, each built and smoke-tested on a runner of its platform from the packed server.
# 4. `github-release`: the GitHub release, once every artefact of the version exists, with the npm
#    tarballs, the install scripts (install.sh, install.ps1; feature 081) and the six bundles
#    attached, and checksums.txt covering the scripts and the bundles. A bundle that failed on any
#    platform stops it, so the packages (085, 087) never point at a partial release.
#
# Run by hand with "dry run" (from main, so the current workflow runs) to check everything, build,
# run and scan both images, build and smoke-test the six bundles, and publish nothing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to check, such as v0.1.0 (it must match the packages' version)"
        required: true
      dry_run:
        description: "Check, pack, build and scan, but don't publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  IMAGE: docker.io/ronneai/marketplace
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  release:
    name: Check, pack and publish
    runs-on: ubuntu-latest
    # Waits for the owner's approval before anything runs: the "npm" environment has the owner as
    # its required reviewer (GitHub Settings → Environments), and npm's trusted publisher is set to
    # this environment too, so no publish happens without that click.
    environment: npm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: The tag matches the packages' version
        id: version
        run: echo "version=$(node packages/repo-tools/src/release-check.js "$TAG")" >> "$GITHUB_OUTPUT"
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The web app's standalone build, which packing @ronneai/marketplace copies in (082).
      - run: pnpm build:server
      - run: pnpm licenses:check
      - run: pnpm audit --audit-level high
      - run: pnpm packages:check
      - run: pnpm release:smoke
      - name: Pack
        run: |
          mkdir -p release
          for folder in core cli mcp server; do
            pnpm --dir "packages/$folder" pack --pack-destination "$PWD/release"
          done
          ls -l release
      # In dependency order. A version already on npm is skipped, so a failed run can be re-run.
      # A package's trusted publisher can only be set once it exists, so the first release of each
      # uses a short-lived token kept as the "npm" environment's NPM_TOKEN secret; then the secret
      # is deleted, and npm uses trusted publishing (OIDC) again. Provenance comes either way.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for name in core rmk mcp marketplace; do
            package="@ronneai/$name"
            # ./ matters: npm reads "release/x.tgz" as a GitHub user/repo, not a file.
            tarball="./release/ronneai-$name-$VERSION.tgz"
            if npm view "$package@$VERSION" version >/dev/null 2>&1; then
              echo "$package@$VERSION is already on npm; skipping."
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              npm publish "$tarball" --access public --dry-run
            else
              npm publish "$tarball" --access public --provenance
            fi
          done
      # The server's tarball for the bundles (084), also on a dry run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-tarball
          path: release/ronneai-marketplace-*.tgz
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      # The install scripts with this version written in, and their checksums (feature 081). Also
      # on a dry run, so the run's log and artefacts show them.
      - name: Install scripts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node packages/repo-tools/src/release-install-scripts.js "$VERSION" install-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-scripts
          path: install-scripts/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      # For the GitHub release, once the image is published too.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.DRY_RUN != 'true'
        with:
          name: npm-tarballs
          path: release/*.tgz
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # One job per architecture, each on a runner of that architecture (no emulation). The image is
  # built, run and scanned first, exactly as on every pull request; only then it's pushed, untagged,
  # by digest. The push is the same build again in the same builder (every layer a cache hit), and a
  # guard checks the pushed image has the scanned image's layers.
  image:
    name: Image (${{ matrix.arch }})
    needs: release
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          arch: ${{ matrix.arch }}

      # Nothing below runs on a dry run: the image was built, run and scanned, and stays here.
      - name: Labels and annotations
        id: meta
        if: env.DRY_RUN != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # The tags aren't used here (the push is by digest); they're computed in `manifest`.
          tags: type=raw,value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=Ronne AI Marketplace
            org.opencontainers.image.description=Self-hosted, curated registry of AI capabilities for AI coding tools
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
          # Custom labels aren't copied to the annotations (the generated ones are), so the
          # description, which metadata-action otherwise takes from the empty GitHub repository
          # description, is given again here.
          annotations: |
            org.opencontainers.image.description=Self-hosted, curated registry of AI capabilities for AI coding tools
      # Its own step, so the token can become an OIDC connection (DOCKERHUB_OIDC_CONNECTIONID and
      # id-token: write) once Docker-Sponsored Open Source accepts Ronne; nothing else changes.
      - name: Log in to Docker Hub
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push by digest, with attestations
        id: push
        if: env.DRY_RUN != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: The pushed image has the scanned image's layers
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          scanned=$(docker image inspect ronne-web:ci --format '{{json .RootFS.Layers}}' | jq -c .)
          # With attestations the push is a one-platform index; .Image is then keyed by platform.
          pushed=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Image}}' \
            | jq -c 'if has("rootfs") then .rootfs.diff_ids else [.[] | select(type == "object" and has("rootfs"))][0].rootfs.diff_ids end')
          echo "scanned: $scanned"
          echo "pushed:  $pushed"
          [ "$scanned" = "$pushed" ] || { echo "The pushed image differs from the one that was scanned."; exit 1; }
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.DRY_RUN != 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # Tags the two pushed images as one multi-architecture image. Versions are immutable, as npm's
  # and Ronne's own are: a version tag that already lists exactly these images is a re-run and is
  # skipped; one that lists other images fails, and the answer is a new version.
  manifest:
    name: Tag the multi-architecture image
    needs: [release, image]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    environment: dockerhub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.release.outputs.version }}
      # Annotations on the index (the manifest list), not on each image's manifest.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      # X.Y.Z, X.Y and X, plus latest; a pre-release gets only X.Y.Z (metadata-action's rule), and
      # a major of 0 gets no X tag, since it promises nothing.
      - name: Tags and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }},enable=${{ !startsWith(needs.release.outputs.version, '0.') }}
          labels: |
            org.opencontainers.image.title=Ronne AI Marketplace
            org.opencontainers.image.description=Self-hosted, curated registry of AI capabilities for AI coding tools
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
          # Custom labels aren't copied to the annotations (the generated ones are), so the
          # description, which metadata-action otherwise takes from the empty GitHub repository
          # description, is given again here.
          annotations: |
            org.opencontainers.image.description=Self-hosted, curated registry of AI capabilities for AI coding tools
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create the manifest list and tag it
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          ls -l digests
          # The manifests each pushed image consists of (its image manifest and its attestation).
          children() {
            raw=$(docker buildx imagetools inspect "$1" --raw 2>/dev/null) || return 0
            case "$(printf '%s' "$raw" | jq -r .mediaType)" in
              *index*|*manifest.list*) printf '%s' "$raw" | jq -r '.manifests[].digest' ;;
              *) printf '%s\n' "${1#*@}" ;;
            esac
          }
          want=$(for f in digests/*; do children "$IMAGE@$(cat "$f")"; done | sort)
          have=$(children "$IMAGE:$VERSION" | sort)
          if [ -n "$have" ]; then
            if [ "$have" = "$want" ]; then
              echo "$IMAGE:$VERSION already lists exactly these images; nothing to do."
              exit 0
            fi
            echo "$IMAGE:$VERSION already exists and lists other images. Versions are immutable: release a new version instead."
            exit 1
          fi
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && args+=(--annotation "$annotation")
          done <<< "$ANNOTATIONS"
          sources=$(for f in digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          # shellcheck disable=SC2086
          docker buildx imagetools create "${args[@]}" $sources
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  # rmk-server with Node.js inside, on each platform's own runner (084). Also on a dry run.
  bundles:
    needs: release
    uses: ./.github/workflows/bundles.yml

  # Last, so a release on GitHub exists only once every artefact of it does.
  github-release:
    name: GitHub release
    needs: [release, manifest, bundles]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: install-scripts
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release
      - name: The install scripts match their checksums; the bundles' are added
        working-directory: release
        run: |
          sha256sum -c checksums.txt
          count=$(ls rmk-server-*.tar.gz rmk-server-*.zip | wc -l)
          [ "$count" -eq 6 ] || { echo "Expected 6 bundles, found $count."; exit 1; }
          sha256sum rmk-server-*.tar.gz rmk-server-*.zip >> checksums.txt
          sha256sum -c checksums.txt
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release $TAG already exists; nothing to do."
            exit 0
          fi
          # The Node.js inside the bundles, read from the Linux x64 one (this runner's platform).
          tar -xzf release/rmk-server-*-linux-x64.tar.gz -C "$RUNNER_TEMP"
          NODE_VERSION=$("$RUNNER_TEMP"/rmk-server-*-linux-x64/node/bin/node --version)
          {
            echo "**Install with Docker:** \`curl -fsSL https://www.ronne.ai/install.sh | sh\` (macOS, Linux) or \`irm https://www.ronne.ai/install.ps1 | iex\` (Windows); both redirect to this release's install.sh and install.ps1 below. Docker image: \`docker pull ${IMAGE#docker.io/}:$VERSION\` (linux/amd64, linux/arm64)."
            echo
            echo "**Without Docker or Node.js:** rmk-server with Node.js ${NODE_VERSION#v} inside, one archive per system: \`rmk-server-$VERSION-linux-x64.tar.gz\`, \`rmk-server-$VERSION-linux-arm64.tar.gz\`, \`rmk-server-$VERSION-darwin-x64.tar.gz\`, \`rmk-server-$VERSION-darwin-arm64.tar.gz\`, \`rmk-server-$VERSION-win32-x64.zip\`, \`rmk-server-$VERSION-win32-arm64.zip\`. Unpack and run \`bin/rmk-server\` (\`bin\\rmk-server.cmd\` on Windows). The Linux archives need glibc 2.34 or later (Debian 12, Ubuntu 22.04, RHEL 9 and newer: SQLite's prebuilt module needs it); elsewhere, Alpine (musl) included, use Docker. Each holds THIRD_PARTY_NOTICES."
            echo
            echo "**With Node.js 22.12 or later:** \`npm install --global @ronneai/marketplace@$VERSION\` (rmk-server), and \`npm install --global @ronneai/rmk@$VERSION @ronneai/mcp@$VERSION\` for the CLI and the MCP server."
            echo
            echo "Every file below is in checksums.txt: \`sha256sum -c checksums.txt --ignore-missing\` after downloading."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            release/*.tgz release/install.sh release/install.ps1 release/rmk-server-*.tar.gz \
            release/rmk-server-*.zip release/checksums.txt
