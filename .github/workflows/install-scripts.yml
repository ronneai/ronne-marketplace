name: Install scripts

# The install script (feature 081): install.sh parsed as POSIX sh by shfmt and its tests run under
# dash and bash (no install.ps1 since 121: on Windows, WSL 2). install.sh's full run, on the image
# just built, is in the image workflow (.github/actions/build-image/install-probe.sh).
#
# A pull request runs it only when it changes the scripts (changes.yml's `install`, ci-scope.js),
# and not while it's a draft: shfmt comes from Docker Hub. nightly.yml runs it on main every night,
# and release.yml on what it publishes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    # A called workflow gets no secrets unless its caller passes them (docs/knowledge/docker-hub-pulls.md).
    secrets:
      DOCKERHUB_READ_TOKEN:
        required: false

permissions:
  contents: read

# github.workflow is the caller's name when another workflow calls this one, so a call never shares
# a group with its caller or with this workflow's own runs.
concurrency:
  group: install-scripts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detects documentation-only pull requests (changes.yml).
  changes:
    uses: ./.github/workflows/changes.yml

  sh:
    name: install.sh (shfmt, dash, bash)
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false'
      && needs.changes.outputs.full != 'false' && needs.changes.outputs.install != 'false' }}
    runs-on: ubuntu-latest
    env:
      # Only whether the secret exists, so the token itself isn't in every step's environment.
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN != '' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Signed in, Docker Hub allows far more pulls than the runners' shared anonymous limit, which
      # failed jobs with 429 Too Many Requests. A read-only token (DOCKERHUB_READ_TOKEN); pull
      # requests from forks get no secrets, so they skip this and pull anonymously, as before.
      - name: Sign in to Docker Hub (read-only)
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}
      # shfmt (BSD-3-Clause) instead of ShellCheck (GPL-3.0): docs/policies/dependencies.md §3.
      - name: Parses as POSIX sh, formatted (shfmt -p)
        run: >-
          docker run --rm -v "$PWD/scripts/install:/w" -w /w
          mvdan/shfmt:v3.14.1@sha256:8c06884a35683d8763fba6c0d9484d11a61a96da65f8d497d6f625825a6043f2
          -p -i 2 -ci -d install.sh test-install.sh
      - name: Tests under dash
        run: dash scripts/install/test-install.sh
      - name: Tests under bash
        run: bash scripts/install/test-install.sh

  # One check to require: it passes when the job passed, or when the pull request didn't need it.
  install-scripts:
    name: Install scripts
    needs: [changes, sh]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: The script passed
        env:
          SH_RESULT: ${{ needs.sh.result }}
        run: |
          echo "install.sh: $SH_RESULT"
          [ "$SH_RESULT" = success ] || [ "$SH_RESULT" = skipped ]
