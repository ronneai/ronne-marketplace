name: Bundles

# The self-contained rmk-server bundles (feature 084): one archive per system and processor, each
# with the official Node.js 24 inside. Called by server-package.yml on every pull request and by
# release.yml, after a job that uploaded the packed @ronneai/marketplace as the "server-tarball"
# artifact. Each archive is built on a runner of its own platform (npm installs the native modules of
# the machine it runs on; nothing cross-compiles), then smoke-tested there with no Node.js on PATH:
# packages/repo-tools/src/bundle-smoke.js unpacks it and runs 082's server-probe.js against its
# launcher. Each passing archive is uploaded as "bundle-<platform>-<arch>".

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, runner: ubuntu-24.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin, arch: x64, runner: macos-15-intel }
          - { platform: darwin, arch: arm64, runner: macos-15 }
          - { platform: win32, arch: x64, runner: windows-2025 }
          - { platform: win32, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      # The build and smoke scripts, the probe and LICENSE; the package comes from the tarball.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/repo-tools/src
            LICENSE
          sparse-checkout-cone-mode: false
      # Only to run the build script; the bundle brings its own Node, and the smoke test takes
      # every Node off PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-tarball
          path: tarball
      - name: Build the bundle
        shell: bash
        run: node packages/repo-tools/src/bundle.js tarball/*.tgz --out bundles
      - name: Smoke test, with no Node.js on PATH
        shell: bash
        run: node packages/repo-tools/src/bundle-smoke.js bundles/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.platform }}-${{ matrix.arch }}
          path: bundles/*
          retention-days: 7
          # A re-run of the release replaces them, as release.yml's uploads do.
          overwrite: true
          if-no-files-found: error
