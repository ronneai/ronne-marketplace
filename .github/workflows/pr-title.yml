name: PR title

# The PR title becomes the squash-merge commit on main, so it must follow the commit format
# (CLAUDE.md, "Commits and pull requests").
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The title is passed through an env var, never interpolated into the script, so it can't inject shell.
      # Dependabot's grouped titles can pass 72 characters, so only the length rule is skipped for it.
      - name: Check title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            node packages/repo-tools/src/check-commit-message.js --no-length "$PR_TITLE"
          else
            node packages/repo-tools/src/check-commit-message.js "$PR_TITLE"
          fi
