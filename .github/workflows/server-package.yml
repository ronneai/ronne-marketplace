name: Server package

# @ronneai/marketplace and its rmk-server command (feature 082) on the systems people run it on.
# One job packs the tarball as the release would; each matrix job installs it with npm, as a person
# would, and runs packages/repo-tools/src/server-probe.js: start with an empty data folder, 503
# setup_required, `rmk-server setup --yes` with SQLite, 200 with no restart, a token from sign-in,
# and the port free after stopping it. service-linux runs `rmk-server service` on systemd (083).
#
# About 20 jobs on six systems, two of them pulling Linux images from Docker Hub, so a pull request
# runs it only when it changes the server, its bundles, packages or services (changes.yml's
# `server`, ci-scope.js), and not while it's a draft. nightly.yml runs it on main every night;
# release.yml runs the same checks on what it publishes (server-checks.yml, bundles.yml,
# packages.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    # A called workflow gets no secrets unless its caller passes them (docs/knowledge/docker-hub-pulls.md).
    secrets:
      DOCKERHUB_READ_TOKEN:
        required: false

permissions:
  contents: read

# github.workflow is the caller's name when another workflow calls this one, so a call never shares
# a group with its caller or with this workflow's own runs.
concurrency:
  group: server-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Detects documentation-only pull requests (changes.yml).
  changes:
    uses: ./.github/workflows/changes.yml

  pack:
    name: Pack @ronneai/marketplace
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false'
      && needs.changes.outputs.full != 'false' && needs.changes.outputs.server != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager. Not Corepack: it can't start pnpm 12.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:server
      - name: Pack
        run: pnpm --dir packages/server pack --pack-destination "$PWD/tarball"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-tarball
          path: tarball/*.tgz
          retention-days: 1
          if-no-files-found: error

  # The self-contained bundles (084), built and smoke-tested on each of the six platforms from the
  # tarball the pack job made, as the release does.
  bundles:
    needs: pack
    uses: ./.github/workflows/bundles.yml

  # The .deb and .rpm (085), from the Linux bundles, tested in Ubuntu, Debian and Fedora containers.
  linux-packages:
    needs: bundles
    uses: ./.github/workflows/packages.yml
    # Only the read-only Docker Hub token, by name: not `inherit`, which would hand over every secret.
    secrets:
      DOCKERHUB_READ_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}

  # The install matrix and the services on Linux, macOS and Windows (server-checks.yml), once the
  # Windows bundle exists.
  checks:
    needs: bundles
    uses: ./.github/workflows/server-checks.yml

  # One check to require: it passes when every system passed, or when the pull request didn't
  # need them.
  server-package:
    name: Server package
    needs: [changes, pack, bundles, checks, linux-packages]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Packed, installed and ran everywhere
        env:
          PACK_RESULT: ${{ needs.pack.result }}
          BUNDLES_RESULT: ${{ needs.bundles.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          PACKAGES_RESULT: ${{ needs.linux-packages.result }}
        run: |
          echo "pack: $PACK_RESULT, bundles: $BUNDLES_RESULT, install and services: $CHECKS_RESULT, packages: $PACKAGES_RESULT"
          for r in "$PACK_RESULT" "$BUNDLES_RESULT" "$CHECKS_RESULT" "$PACKAGES_RESULT"; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
