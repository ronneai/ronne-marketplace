name: Server package

# @ronneai/marketplace and its rmk-server command (feature 082) on the systems people run it on.
# One job packs the tarball as the release would; each matrix job installs it with npm, as a person
# would, and runs packages/repo-tools/src/server-probe.js: start with an empty data folder, 503
# setup_required, `rmk-server setup --yes` with SQLite, 200 with no restart, a token from sign-in,
# and the port free after stopping it. service-linux runs `rmk-server service` on systemd (083).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Detects documentation-only pull requests (changes.yml).
  changes:
    uses: ./.github/workflows/changes.yml

  pack:
    name: Pack @ronneai/marketplace
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager. Not Corepack: it can't start pnpm 12.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:server
      - name: Pack
        run: pnpm --dir packages/server pack --pack-destination "$PWD/tarball"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-tarball
          path: tarball/*.tgz
          retention-days: 1
          if-no-files-found: error

  install:
    name: Install and run (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The minimum supported LTS and the target LTS (docs/policies/dependencies.md §2).
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Only for the probe script; the package comes from the tarball.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/repo-tools/src
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-tarball
          path: tarball
      # ./ matters: npm reads "tarball/x.tgz" as a GitHub user/repo, not a file (as in release.yml).
      - name: npm install --global the tarball
        shell: bash
        run: npm install --global --no-audit --no-fund ./tarball/*.tgz
      - name: Start, set up, sign in, stop
        run: node packages/repo-tools/src/server-probe.js rmk-server

  # `rmk-server service` on a real systemd (feature 083): GitHub's Ubuntu runners boot with it and
  # give passwordless sudo. scripts/service/test-linux-service.sh installs, sets up, restarts,
  # crashes, adds --domain localhost --tls internal through Caddy, removes it, uninstalls and
  # deletes the data.
  service-linux:
    name: Service on Linux (systemd)
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/service
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-tarball
          path: tarball
      - name: npm install --global the tarball
        run: npm install --global --no-audit --no-fund ./tarball/*.tgz
      # Caddy's own release, checked against the SHA-512 its checksums file gives (policy §3). Not
      # put on PATH: the test first checks that --domain asks for it.
      - name: Download Caddy 2.11.6
        env:
          CADDY_SHA512: 422771007d505ea97efd1177a4905b2c1a471cd426668f2ace3bcda3d8e30b11f9b1610bfb02c6ad60f2a795f56124f2f5eec6409c17d5a0dd4c21a11375fb94
        run: |
          curl -fsSL -o "$RUNNER_TEMP/caddy.tar.gz" \
            https://github.com/caddyserver/caddy/releases/download/v2.11.6/caddy_2.11.6_linux_amd64.tar.gz
          echo "$CADDY_SHA512  $RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
      - name: Install, set up, restart, --domain, uninstall
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy
        run: bash scripts/service/test-linux-service.sh
      - name: The services' logs
        if: ${{ failure() }}
        run: sudo journalctl -u rmk-server -u rmk-server-proxy --no-pager | tail -n 200

  # The same on macOS with launchd (083): GitHub's macOS runners give passwordless sudo and let
  # `launchctl bootstrap system` load daemons. Homebrew's Node, so the Homebrew prefix is used and
  # _rmkserver can read the program (a Node under /Users wouldn't be readable to it).
  service-macos:
    name: Service on macOS (launchd)
    needs: pack
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/service
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-tarball
          path: tarball
      - name: Node 24 from Homebrew, and the tarball
        run: |
          brew install node@24
          echo "$(brew --prefix node@24)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix node@24)/bin/npm" install --global --no-audit --no-fund ./tarball/*.tgz
      - name: Download Caddy 2.11.6
        env:
          CADDY_SHA512: 8b08d5a25ab612946b18b82c78fc32b194e69e576dd120cdca44f467ded2d6cb6fcfe899f05a71774f04b454e5cc9adcf08f8545c8d560bd92079ce015c8bf2e
        run: |
          curl -fsSL -o "$RUNNER_TEMP/caddy.tar.gz" \
            https://github.com/caddyserver/caddy/releases/download/v2.11.6/caddy_2.11.6_mac_arm64.tar.gz
          echo "$CADDY_SHA512  $RUNNER_TEMP/caddy.tar.gz" | shasum -a 512 -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
      - name: Install, set up, KeepAlive, --domain, --user, uninstall
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy
        run: bash scripts/service/test-macos-service.sh
      - name: The services' logs
        if: ${{ failure() }}
        run: sudo tail -n 200 /Library/Logs/rmk-server/server.log /Library/Logs/rmk-server/proxy.log

  # One check to require: it passes when every system passed, or when they were skipped for a
  # docs-only pull request.
  server-package:
    name: Server package
    needs: [changes, pack, install, service-linux, service-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Packed, installed and ran everywhere
        env:
          PACK_RESULT: ${{ needs.pack.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
          SERVICE_RESULT: ${{ needs.service-linux.result }}
          MACOS_RESULT: ${{ needs.service-macos.result }}
        run: |
          echo "pack: $PACK_RESULT, install: $INSTALL_RESULT, service: $SERVICE_RESULT, macOS: $MACOS_RESULT"
          for r in "$PACK_RESULT" "$INSTALL_RESULT" "$SERVICE_RESULT" "$MACOS_RESULT"; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
