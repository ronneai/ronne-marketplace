name: Database

# The database tests (the `db` Vitest project) against each supported server (feature 004).
# Pull requests and pushes test the minimum versions Ronne supports. A weekly run (and a manual one)
# tests the latest versions instead, to hear about breaking releases early; it never blocks a pull
# request. SQLite runs in ci.yml with the other tests, all of them on every pull request.
# On a pull request that changes no database code (changes.yml's `database`, 112), the servers run
# only the database code's own tests (`pnpm test:db:core`); main, weekly and manual runs run all.
# A draft pull request skips them until it's ready for review. nightly.yml and release.yml call it
# (`versions: minimum`), and then it runs every test.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      versions:
        description: '"minimum" (the versions Ronne supports) or "latest"'
        type: string
        default: minimum
    # A called workflow gets no secrets unless its caller passes them (docs/knowledge/docker-hub-pulls.md).
    secrets:
      DOCKERHUB_READ_TOKEN:
        required: false

permissions:
  contents: read

# github.workflow is the caller's name when another workflow calls this one, so a call never shares
# a group with its caller or with this workflow's own runs.
concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Detects documentation-only pull requests (changes.yml).
  changes:
    uses: ./.github/workflows/changes.yml

  test:
    # Pull request job names stay "Database tests (<database>)" so the required checks match.
    name: Database tests (${{ matrix.database }}${{ (inputs.versions == 'latest' || (inputs.versions == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && ', latest' || '' }})
    needs: changes
    # Runs even if detection failed: its steps skip only on an explicit "false".
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      # Only whether the secret exists, so the token itself isn't in every step's environment.
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN != '' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            image: postgres:15
            latest: postgres:latest
            port: 5432
            url: postgres://postgres:ronne-test@127.0.0.1:5432/postgres
            health: pg_isready -U postgres
          - database: mysql
            image: mysql:8.4
            latest: mysql:lts
            port: 3306
            url: mysql://root:ronne-test@127.0.0.1:3306/ronne
            # Over TCP, so it only passes once the real server is up (not the temporary init server).
            health: mysqladmin ping -h 127.0.0.1 -uroot -pronne-test
          - database: mariadb
            image: mariadb:10.11
            latest: mariadb:lts
            port: 3306
            url: mysql://root:ronne-test@127.0.0.1:3306/ronne
            health: healthcheck.sh --connect --innodb_initialized
    steps:
      - name: Documentation only, nothing to check
        if: needs.changes.outputs.code == 'false' || needs.changes.outputs.full == 'false'
        run: echo "This pull request is documentation only, or a draft, so the checks are skipped."
      # Signed in, Docker Hub allows far more pulls than the runners' shared anonymous limit, which
      # failed jobs with 429 Too Many Requests. A read-only token (DOCKERHUB_READ_TOKEN); pull
      # requests from forks get no secrets, so they skip this and pull anonymously, as before.
      - name: Sign in to Docker Hub (read-only)
        if: env.HAS_DOCKERHUB_TOKEN == 'true' && needs.changes.outputs.code != 'false' && needs.changes.outputs.full != 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}
      # Started in a step, not as a service container: GitHub starts service containers before any
      # step, even when every step skips, which cost each documentation-only pull request 10–40
      # seconds. It boots while dependencies install; the tests wait for it to be healthy.
      - name: Start ${{ matrix.database }}
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.full != 'false'
        env:
          IMAGE: ${{ (inputs.versions == 'latest' || (inputs.versions == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && matrix.latest || matrix.image }}
          PORT: ${{ matrix.port }}
          HEALTH: ${{ matrix.health }}
        # Each image reads only its own variables; the others are ignored.
        run: >-
          docker run -d --name database -p "$PORT:$PORT"
          -e POSTGRES_PASSWORD=ronne-test
          -e MYSQL_ROOT_PASSWORD=ronne-test -e MYSQL_DATABASE=ronne
          -e MARIADB_ROOT_PASSWORD=ronne-test -e MARIADB_DATABASE=ronne
          --health-cmd "$HEALTH" --health-interval 2s --health-timeout 5s --health-retries 60
          "$IMAGE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.full != 'false'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.full != 'false'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.full != 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.full != 'false'
      - name: Wait for ${{ matrix.database }}
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.full != 'false'
        run: |
          for i in $(seq 1 90); do
            health=$(docker inspect -f '{{.State.Health.Status}}' database)
            if [ "$health" = healthy ]; then echo "The database is healthy."; exit 0; fi
            sleep 2
          done
          echo "The database didn't become healthy."; docker logs database; exit 1
      # Includes the setup smoke test: `pnpm run setup --yes` against an empty database (task 4).
      - name: Database tests
        if: needs.changes.outputs.code != 'false' && needs.changes.outputs.full != 'false'
        run: |
          if [ "$SCOPE" = core ]; then
            echo "No database code changed: the database code's own tests."
            pnpm test:db:core
          else
            pnpm test:db
          fi
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
          SCOPE: ${{ needs.changes.outputs.database }}
