name: Database

# The database tests (the `db` Vitest project) against each supported server (feature 004).
# Pull requests and pushes test the minimum versions Ronne supports. A weekly run (and a manual one)
# tests the latest versions instead, to hear about breaking releases early; it never blocks a pull
# request. SQLite runs in ci.yml with the other tests.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  test:
    # Pull request job names stay "Database tests (<database>)" so the required checks match.
    name: Database tests (${{ matrix.database }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && ', latest' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            image: postgres:15
            latest: postgres:latest
            port: 5432
            url: postgres://postgres:ronne-test@127.0.0.1:5432/postgres
            health: pg_isready -U postgres
          - database: mysql
            image: mysql:8.4
            latest: mysql:lts
            port: 3306
            url: mysql://root:ronne-test@127.0.0.1:3306/ronne
            # Over TCP, so it only passes once the real server is up (not the temporary init server).
            health: mysqladmin ping -h 127.0.0.1 -uroot -pronne-test
          - database: mariadb
            image: mariadb:10.11
            latest: mariadb:lts
            port: 3306
            url: mysql://root:ronne-test@127.0.0.1:3306/ronne
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.latest || matrix.image }}
        # Each image reads only its own variables; the others are ignored.
        env:
          POSTGRES_PASSWORD: ronne-test
          MYSQL_ROOT_PASSWORD: ronne-test
          MYSQL_DATABASE: ronne
          MARIADB_ROOT_PASSWORD: ronne-test
          MARIADB_DATABASE: ronne
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the setup smoke test: `pnpm run setup --yes` against an empty database (task 4).
      - name: Database tests
        run: pnpm test:db
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
