name: Image

# The Docker image (feature 005): builds for amd64 and arm64, runs each image and checks it answers
# in setup mode, and scans it for known vulnerabilities (docs/policies/dependencies.md §3).
#
# Each architecture builds natively on its own runner, in parallel: arm64 under QEMU on an amd64
# runner took about 5 of the old 7–8 minutes. The repository is public, so the arm64 runner is free.
#
# A pull request builds the image only when it changes what the image adds (changes.yml's `image`,
# ci-scope.js), only for amd64, and not while it's a draft: each build pulls the node base, Trivy
# and Caddy from Docker Hub (docs/knowledge/docker-hub-pulls.md). Main, nightly.yml and
# release.yml build both architectures and scan them.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    # A called workflow gets no secrets unless its caller passes them (docs/knowledge/docker-hub-pulls.md).
    secrets:
      DOCKERHUB_READ_TOKEN:
        required: false

permissions:
  contents: read

# github.workflow is the caller's name when another workflow calls this one, so a call never shares
# a group with its caller or with this workflow's own runs.
concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detects documentation-only pull requests (changes.yml).
  changes:
    uses: ./.github/workflows/changes.yml

  build:
    name: Image (${{ matrix.arch }})
    needs: changes
    # Skipped for a pull request that's documentation only, a draft, or changes nothing the image
    # adds; the `image` job below still passes then.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false'
      && needs.changes.outputs.full != 'false' && needs.changes.outputs.image != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 on a pull request; both architectures everywhere else.
        include: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('[{"arch":"amd64","runner":"ubuntu-latest"}]')
          || fromJSON('[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      # Only whether the secret exists, so the token itself isn't in every step's environment.
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN != '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Signed in, Docker Hub allows far more pulls than the runners' shared anonymous limit, which
      # failed jobs with 429 Too Many Requests. A read-only token (DOCKERHUB_READ_TOKEN); pull
      # requests from forks get no secrets, so they skip this and pull anonymously, as before.
      - name: Sign in to Docker Hub (read-only)
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}
      # The build, the run and the scan live in one composite action, shared with release.yml
      # (feature 035), so the published image is checked exactly as every pull request's.
      # The cache is exported only from main: a pull request's cache is visible to that pull request
      # alone, and exporting every layer for it took over 2 minutes. Pull requests read main's.
      - uses: ./.github/actions/build-image
        with:
          arch: ${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=image-{0}', matrix.arch) || '' }}

  # The required check. Branch protection names this job, so it keeps the name the single job had;
  # it passes when the builds passed, or when the pull request didn't need them.
  image:
    name: Docker image (build, run, scan)
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: The images built, ran and passed the scan
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "Image builds: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]
