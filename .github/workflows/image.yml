name: Image

# The Docker image (feature 005): builds for amd64 and arm64, runs each image and checks it answers
# in setup mode, and scans it for known vulnerabilities (docs/policies/dependencies.md §3).
#
# Each architecture builds natively on its own runner, in parallel: arm64 under QEMU on an amd64
# runner took about 5 of the old 7–8 minutes. The repository is public, so the arm64 runner is free.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detects documentation-only pull requests (changes.yml).
  changes:
    uses: ./.github/workflows/changes.yml

  build:
    name: Image (${{ matrix.arch }})
    needs: changes
    # Skipped only when the PR changes documentation alone; the `image` job below still passes then.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The cache is exported only from main: a pull request's cache is visible to that pull request
      # alone, and exporting every layer for it took over 2 minutes. Pull requests read main's.
      - name: Build and load the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build summary and record artifact aren't used, and uploading them took ~30 s.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ronne-web:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=image-{0}', matrix.arch) || '' }}

      - name: Run it and check it answers in setup mode
        run: |
          docker run -d --name ronne -p 3000:3000 ronne-web:ci
          for i in $(seq 1 60); do
            body=$(curl -s http://127.0.0.1:3000/api/health || true)
            case "$body" in *setup_required*) echo "OK: $body"; exit 0 ;; esac
            sleep 1
          done
          echo "The container didn't answer with setup_required. Last response: $body"
          docker logs ronne
          exit 1

      # Trivy's own image, pinned by digest (a multi-arch index), instead of a third-party action.
      - name: Scan for known vulnerabilities (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ronne-web:ci

  # The required check. Branch protection names this job, so it keeps the name the single job had;
  # it passes when both architectures passed, or when they were skipped for a docs-only PR.
  image:
    name: Docker image (build, run, scan)
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Both architectures built, ran and passed the scan
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "Image builds: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]
