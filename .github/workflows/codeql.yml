name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  # Detects documentation-only pull requests (changes.yml).
  changes:
    uses: ./.github/workflows/changes.yml

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # Runs even if detection failed: its steps skip only on an explicit "false".
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # "actions" scans the workflows themselves, for problems such as script injection.
        language: [javascript-typescript, actions]
    steps:
      - name: Documentation only, nothing to check
        if: needs.changes.outputs.code == 'false'
        run: echo "This pull request only changes documentation, so the checks are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: needs.changes.outputs.code != 'false'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: needs.changes.outputs.code != 'false'
        with:
          category: /language:${{ matrix.language }}
