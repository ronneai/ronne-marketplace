name: Clients on Windows

# Reusable (121): the commands people run on Windows, `rmk` and `rmk-mcp`, with @ronneai/core under
# them, built and tested on Windows. The server doesn't run there (WSL 2 or a Linux VM instead),
# so this is the only Windows check. Called by ci.yml (`run` from changes.yml: a pull request that
# changes these packages, or the shared files; every push to main) and by nightly.yml.
on:
  workflow_call:
    inputs:
      run:
        description: '"false" skips the tests (a pull request that doesn''t change the clients); anything else runs them'
        type: string
        default: "true"

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: rmk and rmk-mcp on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: The clients didn't change, nothing to check
        if: inputs.run == 'false'
        run: echo "This pull request doesn't change @ronneai/core, rmk or rmk-mcp."
      # The runners turn core.autocrlf on: the examples and golden files would be checked out with
      # CRLF and differ from what the renderers write. The tests compare the files as committed.
      - name: Keep line ends as committed
        if: inputs.run != 'false'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.run != 'false'
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager. Not Corepack: it can't start pnpm 12.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.run != 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.run != 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Only the clients and what they use: the server package is Linux and macOS only (its `os`).
      - if: inputs.run != 'false'
        run: pnpm install --frozen-lockfile --filter "@ronneai/rmk..." --filter "@ronneai/mcp..."
      - name: Build and test @ronneai/core, rmk and rmk-mcp
        if: inputs.run != 'false'
        run: pnpm exec turbo run build test --filter=@ronneai/core --filter=@ronneai/rmk --filter=@ronneai/mcp
