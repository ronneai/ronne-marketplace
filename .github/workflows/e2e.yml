name: End-to-end

# Reusable: the Playwright tests (apps/web/e2e) in two halves in parallel (112), each building the
# app and running half the tests (Playwright's --shard) against its own throwaway SQLite instance.
# Called by ci.yml (pull requests and main, with its `run` input from changes.yml), nightly.yml
# and release.yml. The caller's job reports the required check, "End-to-end (Chromium)".
on:
  workflow_call:
    inputs:
      run:
        description: '"false" skips the tests (a documentation-only or draft pull request); anything else runs them'
        type: string
        default: "true"

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: End-to-end (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Ubuntu's mirror sometimes takes 11 minutes for Playwright's system packages, and the tests
    # need about 7 (#231 on 2026-10-23, main on 2026-10-26): 25 leaves room for both.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Nothing to check
        if: inputs.run == 'false'
        run: echo "This pull request is documentation only, or a draft, so the end-to-end tests are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.run != 'false'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.run != 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.run != 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: inputs.run != 'false'
      # Chromium, and WebKit for the iOS Safari phone project (065; dependency exception E-5), from
      # Playwright's own download, with the system libraries they need. This is the only step that
      # fetches browsers: installing @playwright/test runs no scripts.
      # A normal install takes under a minute, but Ubuntu's mirror sometimes stalls it until the job
      # limit (docs/knowledge/ci-runner-and-mirror-stalls.md). Each part gets 3 tries, each cut at a
      # few minutes, and apt keeps the packages it already downloaded, so the next try is shorter. A
      # stalled apt costs at most 15 minutes (3 x 1 + 3 x 4), and the step then fails with a warning
      # per try, inside the job's 25.
      # `--with-deps` isn't used: Playwright runs apt-get through sudo, where a timeout around it can't
      # reach it, so a stalled try ran until the job limit. Here apt-get runs under `sudo timeout`, and
      # Playwright itself only lists the packages and fetches the browsers, without root.
      - working-directory: apps/web
        run: |
          tries() { # <what> <command...>: up to 3 tries, each one timed in the log.
            for attempt in 1 2 3; do
              start=$SECONDS
              if "${@:2}"; then echo "$1: try $attempt took $((SECONDS - start)) s"; return 0; fi
              echo "::warning::$1: try $attempt of 3 failed or timed out after $((SECONDS - start)) s"
            done
            return 1
          }
          playwright=./node_modules/.bin/playwright
          tries "apt-get update" sudo timeout --kill-after=15 60 apt-get update
          # The system packages the two browsers need and this runner lacks, as Playwright lists them
          # (it simulates the install with `apt-get install -s`, which needs no root). Only package
          # names pass the filter.
          missing=$("$playwright" install-deps --dry-run chromium webkit 2>&1 \
            | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p')
          if [ -n "$missing" ]; then
            # Word splitting on purpose: one argument per package name.
            # shellcheck disable=SC2086
            tries "apt-get install" sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15 240 \
              apt-get install -y --no-install-recommends $missing
          fi
          tries "browsers" timeout --kill-after=15 300 "$playwright" install chromium webkit
        if: inputs.run != 'false'
      # Builds the web app, sets up a throwaway SQLite instance and runs this half of the tests
      # (apps/web/e2e). Each half has its own instance: no test relies on another's data.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
        if: inputs.run != 'false'
      # The phone sweep's reports (065): pages that scroll sideways and controls under 44px.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && inputs.run != 'false' }}
        with:
          name: mobile-sweep-reports-${{ matrix.shard }}
          path: apps/web/test-results/**/*.txt
          if-no-files-found: ignore
          # A release re-run, or nightly and a release in one day, upload again.
          overwrite: true
