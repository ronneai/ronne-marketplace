name: End-to-end

# Reusable: the Playwright tests (apps/web/e2e) in two halves in parallel (112), each building the
# app and running half the tests (Playwright's --shard) against its own throwaway SQLite instance.
# Called by ci.yml (pull requests and main, with its `run` input from changes.yml), nightly.yml
# and release.yml. The caller's job reports the required check, "End-to-end (Chromium)".
on:
  workflow_call:
    inputs:
      run:
        description: '"false" skips the tests (a documentation-only or draft pull request); anything else runs them'
        type: string
        default: "true"

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: End-to-end (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Nothing to check
        if: inputs.run == 'false'
        run: echo "This pull request is documentation only, or a draft, so the end-to-end tests are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.run != 'false'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.run != 'false'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.run != 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: inputs.run != 'false'
      # Chromium, and WebKit for the iOS Safari phone project (065; dependency exception E-5), from
      # Playwright's own download, with the system libraries they need. This is the only step that
      # fetches browsers: installing @playwright/test runs no scripts.
      - run: pnpm --filter @ronneai/web exec playwright install --with-deps chromium webkit
        if: inputs.run != 'false'
      # Builds the web app, sets up a throwaway SQLite instance and runs this half of the tests
      # (apps/web/e2e). Each half has its own instance: no test relies on another's data.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
        if: inputs.run != 'false'
      # The phone sweep's reports (065): pages that scroll sideways and controls under 44px.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && inputs.run != 'false' }}
        with:
          name: mobile-sweep-reports-${{ matrix.shard }}
          path: apps/web/test-results/**/*.txt
          if-no-files-found: ignore
          # A release re-run, or nightly and a release in one day, upload again.
          overwrite: true
