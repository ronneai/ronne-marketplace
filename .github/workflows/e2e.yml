name: End-to-end

# Reusable: the Playwright tests (apps/web/e2e) in two halves in parallel (112), each building the
# app and running half the tests (Playwright's --shard) against its own throwaway SQLite instance.
# Called by ci.yml (pull requests and main, with its `run` input from changes.yml), nightly.yml
# and release.yml. The caller's job reports the required check, "End-to-end (Chromium)".
on:
  workflow_call:
    inputs:
      run:
        description: '"false" skips the tests (a documentation-only or draft pull request); anything else runs them'
        type: string
        default: "true"

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: End-to-end (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Ubuntu's mirror sometimes takes 11 minutes for Playwright's system packages, and the tests
    # need about 7 (#231 on 2026-10-23, main on 2026-10-26): 25 leaves room for both.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Nothing to check
        if: inputs.run == 'false'
        run: echo "This pull request is documentation only, or a draft, so the end-to-end tests are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.run != 'false'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.run != 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.run != 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: inputs.run != 'false'
      # Chromium, and WebKit for the iOS Safari phone project (065; dependency exception E-5), from
      # Playwright's own download, with the system libraries they need. This is the only step that
      # fetches browsers: installing @playwright/test runs no scripts.
      # A normal install takes under a minute, but Ubuntu's mirror sometimes stalls it until the job
      # limit (4 times on 2026-10-26, docs/knowledge/ci-runner-and-mirror-stalls.md). Each try gets
      # 5 minutes and apt keeps the packages it already downloaded, so the next try is shorter.
      - run: |
          for attempt in 1 2 3; do
            timeout 300 pnpm --filter @ronneai/web exec playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Playwright install try $attempt of 3 failed or timed out"
          done
          exit 1
        if: inputs.run != 'false'
      # Builds the web app, sets up a throwaway SQLite instance and runs this half of the tests
      # (apps/web/e2e). Each half has its own instance: no test relies on another's data.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
        if: inputs.run != 'false'
      # The phone sweep's reports (065): pages that scroll sideways and controls under 44px.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && inputs.run != 'false' }}
        with:
          name: mobile-sweep-reports-${{ matrix.shard }}
          path: apps/web/test-results/**/*.txt
          if-no-files-found: ignore
          # A release re-run, or nightly and a release in one day, upload again.
          overwrite: true
