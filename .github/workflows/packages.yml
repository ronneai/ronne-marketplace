name: Linux packages

# The .deb and .rpm of rmk-server (feature 085), built with nFPM from the Linux bundles (084) and
# tested where people install them. Called by server-package.yml on every pull request and by
# release.yml, after bundles.yml uploaded "bundle-linux-x64" and "bundle-linux-arm64". For each
# processor: the packages for this version and an older one (0.0.1, to test an upgrade), then
# scripts/packages/test-linux-package.sh in containers booted with systemd (Ubuntu 24.04,
# Debian 13, Fedora 42): install, set up, upgrade, remove, install again, purge. The passing
# packages are uploaded as "linux-packages-<arch>".

on:
  workflow_call:
    # A called workflow gets no secrets unless its caller passes them: without this, the sign-in
    # below always skipped and the package tests pulled anonymously.
    secrets:
      DOCKERHUB_READ_TOKEN:
        required: false

permissions:
  contents: read

env:
  NFPM_VERSION: 2.47.0

jobs:
  package:
    name: Packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            nfpm: Linux_x86_64
            # nFPM's checksums.txt for v2.47.0 (policy §3: version and checksum pinned).
            nfpm_sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          - arch: arm64
            runner: ubuntu-24.04-arm
            nfpm: Linux_arm64
            nfpm_sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
    runs-on: ${{ matrix.runner }}
    env:
      # Only whether the secret exists, so the token itself isn't in every step's environment.
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN != '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/repo-tools/src
            packaging/linux
            scripts/packages
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-linux-${{ matrix.arch }}
          path: bundle
      - name: Download nFPM ${{ env.NFPM_VERSION }}
        env:
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
        run: |
          archive="nfpm_${NFPM_VERSION}_${{ matrix.nfpm }}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$archive"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" nfpm
      - name: Build the packages, and older ones to upgrade from
        run: |
          # Not "packages/": that's the repository's own folder, with repo-tools in it.
          node packages/repo-tools/src/package-linux.js bundle/*.tar.gz --nfpm "$RUNNER_TEMP/nfpm" --out linux-packages
          node packages/repo-tools/src/package-linux.js bundle/*.tar.gz --nfpm "$RUNNER_TEMP/nfpm" --version 0.0.1 --out older
          ls -l linux-packages older
      # Signed in, Docker Hub allows far more pulls than the runners' shared anonymous limit, which
      # failed jobs with 429 Too Many Requests. A read-only token (DOCKERHUB_READ_TOKEN); pull
      # requests from forks get no secrets, so they skip this and pull anonymously, as before.
      - name: Sign in to Docker Hub (read-only)
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}
      - name: Install, set up, upgrade, remove, purge in Ubuntu, Debian and Fedora
        run: bash scripts/packages/test-in-containers.sh older linux-packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-${{ matrix.arch }}
          path: linux-packages/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
