name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft runs only the light checks (changes.yml's `full`); marking it ready
    # runs the rest.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Detects documentation-only pull requests (changes.yml).
  changes:
    uses: ./.github/workflows/changes.yml

  checks:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    needs: changes
    # Runs even if detection failed: its steps skip only on an explicit "false".
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported LTS and the target LTS (docs/policies/dependencies.md §2).
        node: [22, 24]
    steps:
      - name: Documentation only, nothing to check
        if: needs.changes.outputs.code == 'false'
        run: echo "This pull request only changes documentation, so the checks are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager. Not Corepack: it can't start pnpm 12.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code != 'false'
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code != 'false'
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ matrix.node }}-
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.code != 'false'
      - run: pnpm lint
        if: needs.changes.outputs.code != 'false' && matrix.node == 24
      - run: pnpm typecheck
        if: needs.changes.outputs.code != 'false' && matrix.node == 24
      - run: pnpm test
        if: needs.changes.outputs.code != 'false'
      - run: pnpm build
        if: needs.changes.outputs.code != 'false'
      # Lint, typecheck and the packing below don't depend on Node's version, so they run once, on the
      # target LTS; Node 22 runs the tests and the build. server-package.yml installs the packed
      # server on Node 22 and 24.
      # The web app's standalone build, which packing @ronneai/marketplace copies in (082).
      - run: pnpm build:server
        if: needs.changes.outputs.code != 'false' && matrix.node == 24
      # What the four packages would publish: dist code, README and LICENSE, and the server's app/
      # without a .env or a native binary (034, 082).
      - run: pnpm packages:check
        if: needs.changes.outputs.code != 'false' && matrix.node == 24
      # Installs the packed tarballs with npm and runs rmk, rmk-mcp and rmk-server, as a user would
      # (034, 082).
      - run: pnpm release:smoke
        if: needs.changes.outputs.code != 'false' && matrix.node == 24

  # The state witness records (docs/knowledge/state-witness.md). They are documentation, so this
  # runs on every pull request; it needs only Node.
  witness:
    name: Witness records
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node packages/repo-tools/src/check-witness.js

  dependencies:
    name: Licenses and known vulnerabilities
    needs: changes
    # Skipped (which counts as passing) only when the PR changes documentation alone.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every installed package against license-policy.json (policy §1).
      - run: pnpm licenses:check
      # Fails on high or critical advisories anywhere in the install tree (policy §3).
      - run: pnpm audit --audit-level high

  e2e:
    # Two halves in parallel (112, e2e.yml), each building the app and running half the tests. The
    # required check is `e2e-result` below, which keeps the old name. A draft pull request skips
    # them until it's ready for review.
    needs: changes
    # Like `checks`: the steps skip on documentation-only and draft pull requests, so the check
    # still reports.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/e2e.yml
    with:
      run: ${{ (needs.changes.outputs.code == 'false' || needs.changes.outputs.full == 'false') && 'false' || 'true' }}

  e2e-result:
    # The required check (branch protection names it): passes when both halves passed. On a
    # documentation-only or draft pull request they pass too, with their steps skipped.
    name: End-to-end (Chromium)
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both halves passed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "End-to-end halves: $RESULT"
          test "$RESULT" = "success"
