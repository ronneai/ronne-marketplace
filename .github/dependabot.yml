# Weekly updates with a 3-day cooldown (docs/policies/dependencies.md §2, §3).
# The "[chore]" prefix makes titles match the PR title check: Dependabot adds the colon.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: "[chore]"
    open-pull-requests-limit: 10
    ignore:
      # Types follow the minimum supported Node.js (22), not the newest, so code can't use APIs that
      # Node 22 lacks. Move to a new major by hand when the minimum changes (dependency policy §2).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates together; each major version gets its own PR.
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # The workflows, and the composite action they share (feature 035).
    directories: ["/", "/.github/actions/build-image"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: "[chore]"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The base image digest in the Dockerfile (feature 005).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: "[chore]"
    # These versions are chosen on purpose: the Dockerfile targets the Node.js Active LTS, and the
    # compose files pin the minimum supported database versions (the latest ones are tested weekly).
    # Majors move by hand, when docs/policies/dependencies.md changes. Minor, patch and digest
    # updates still come through.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]

  # Images in compose.yaml (the app and the Caddy proxy, 080) and docker/test-databases.compose.yml.
  - package-ecosystem: docker-compose
    directories: ["/", "/docker"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: "[chore]"
    # These versions are chosen on purpose: the Dockerfile targets the Node.js Active LTS, and the
    # compose files pin the minimum supported database versions (the latest ones are tested weekly).
    # Majors move by hand, when docs/policies/dependencies.md changes. Minor, patch and digest
    # updates still come through. ronneai/marketplace is this repository's own image (feature 035).
    ignore:
      - dependency-name: ronneai/marketplace
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]
