# Ronne with Docker Compose (features 005 and 035). This file is enough on its own: it pulls the
# published image, ronneai/marketplace on Docker Hub, so no clone is needed.
#
#   docker compose up -d                            start Ronne (SQLite, data in the ronne-data volume)
#   then open http://localhost:3000 (or PUBLIC_URL) and follow the setup in the browser.
#   Anyone who can open that address first can set it up: do it straight away, or set it up before
#   exposing the port with `docker compose exec web pnpm run setup` (asks the same questions).
#
#   docker compose pull web && docker compose up -d       upgrade (migrations run on start)
#   RONNE_IMAGE=ronneai/marketplace:0.1.0                 pin a version (environment or .env)
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#                                                         build the image from this checkout instead
#
# To try it with PostgreSQL or MySQL instead of SQLite, add a profile, and point the setup at it:
#   docker compose --profile postgres up -d         then in setup: host "postgres", database and user "ronne"
#   docker compose --profile mysql up -d            then in setup: host "mysql", database and user "ronne"
# The database's password is RONNE_DB_PASSWORD (set it in the environment or a .env file next to
# this one). These databases are only reachable inside this compose project.
# Not "ronne": that name is reserved for another product, whose compose project may exist on the
# same machine. A shared project name would share volumes (ronne_postgres-data), so `down -v` here
# could delete the other project's data.
name: ronne-marketplace

services:
  web:
    image: ${RONNE_IMAGE:-ronneai/marketplace:latest}
    restart: unless-stopped
    ports:
      - "${RONNE_PORT:-3000}:3000"
    environment:
      # The address people use to open Ronne. The one setting most people change.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - ronne-data:/app/data

  postgres:
    profiles: [postgres]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ronne
      POSTGRES_DB: ronne
      POSTGRES_PASSWORD: ${RONNE_DB_PASSWORD:-change-me-please}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ronne", "-d", "ronne"]
      interval: 5s
      retries: 20

  mysql:
    profiles: [mysql]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ronne
      MYSQL_USER: ronne
      MYSQL_PASSWORD: ${RONNE_DB_PASSWORD:-change-me-please}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uronne", "-p${RONNE_DB_PASSWORD:-change-me-please}"]
      interval: 5s
      retries: 30

volumes:
  ronne-data:
  postgres-data:
  mysql-data:
