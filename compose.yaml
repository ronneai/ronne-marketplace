# Ronne with Docker Compose (feature 005).
#
#   docker compose up -d                            start Ronne (SQLite, data in the ronne-data volume)
#   docker compose exec web pnpm run setup          set it up (asks questions), then:
#   docker compose restart web
#
# To try it with PostgreSQL or MySQL instead of SQLite, add a profile, and point setup at it:
#   docker compose --profile postgres up -d         then in setup: host "postgres", database and user "ronne"
#   docker compose --profile mysql up -d            then in setup: host "mysql", database and user "ronne"
# The database's password is RONNE_DB_PASSWORD (set it in the environment or a .env file next to
# this one). These databases are only reachable inside this compose project.
name: ronne

services:
  web:
    build: .
    image: ronne-web:local
    restart: unless-stopped
    ports:
      - "${RONNE_PORT:-3000}:3000"
    environment:
      # The address people use to open Ronne. The one setting most people change.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - ronne-data:/app/data

  postgres:
    profiles: [postgres]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ronne
      POSTGRES_DB: ronne
      POSTGRES_PASSWORD: ${RONNE_DB_PASSWORD:-change-me-please}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ronne", "-d", "ronne"]
      interval: 5s
      retries: 20

  mysql:
    profiles: [mysql]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ronne
      MYSQL_USER: ronne
      MYSQL_PASSWORD: ${RONNE_DB_PASSWORD:-change-me-please}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uronne", "-p${RONNE_DB_PASSWORD:-change-me-please}"]
      interval: 5s
      retries: 30

volumes:
  ronne-data:
  postgres-data:
  mysql-data:
